name: Harness gate

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  harness:
    name: Validate .harness/ contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run harness check
        env:
          HARNESS_BASE_REF: origin/${{ gitea.base_ref }}
        run: bash scripts/check-harness.sh
